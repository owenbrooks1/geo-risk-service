[project]
name = "geo-risk-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.156.8",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
